[project]
name = "tomas-jax"
version = "0.1.0"
description = "High-performance, differentiable aerosol microphysics in JAX"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "jax>=0.4.30",
    "jaxlib>=0.4.30",
    "diffrax>=0.6.0",
    "numpy>=1.26",
    "scipy>=1.12",
    "matplotlib>=3.8",
    # AAAR tutorial: SOA absorptive partitioning kernel (soacond physics), pinned
    "vbs-jax @ git+https://github.com/reflective-org/vbs-jax@4a67f16d5585aee198c62819f1bd52fc0daed9d5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ipython>=8.0",
]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]
# AAAR tutorial: TUV-x photolysis (needs the tuvx-jax data/ dir; set TUVX_JAX_ROOT)
photolysis = [
    "tuvx-jax @ git+https://github.com/reflective-org/tuvx-jax@655668c0ca01c8127ae17c51916ecf55be192a9f",
]
notebook = [
    "jupyterlab>=4.0",
    "ipywidgets>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["tomas_jax"]

[tool.pytest.ini_options]
testpaths = ["tests"]
